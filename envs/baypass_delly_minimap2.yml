# BayPass, DELLY and minimap2 (cluster steps 6, 10 and 12). Not a conda
# environment on the cluster: the scripts call standalone builds (BAYPASS and
# DELLY in cluster/config.sh; software/minimap2-2.30/minimap2). Versions are
# from the binaries (`g_baypass -help`, `delly --version`,
# `minimap2 --version`). BayPass was compiled from the baypass_public-master
# sources; the POD script also sources its utils/baypass_utils.R. This file
# pins the same versions for a rerun.
name: culex-baypass-delly-minimap2
channels:
  - conda-forge
  - bioconda
dependencies:
  - baypass=3.1
  - delly=1.7.3
  - minimap2=2.30
