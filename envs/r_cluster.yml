# R on the cluster: the R/4.5.3 module with packages in the user library
# (R_LIBS_USER=$HOME/R/x86_64-pc-linux-gnu-library/4.5). Used by the BayPass
# scripts (04_baypass/*.R), the windowed f3 scripts (05_windowed_stats/*.R),
# 06_depth/glmm/04_aggregate_cds_depth.R and 07_multilocus/01_genome_wide_null.R.
# Not a conda environment on the cluster; this file pins the versions for a
# rerun. Package versions from the cluster library (2026-10-02).
name: culex-r-cluster
channels:
  - conda-forge
dependencies:
  - r-base=4.5.3
  - r-poolfstat=3.1.0
  - r-vcfr=1.16.0
  - r-data.table=1.18.4
  - r-dplyr=1.2.1
  - r-tidyr=1.3.2
  - r-tibble=3.3.1
  - r-stringr=1.6.0
  - r-purrr=1.2.2
  - r-optparse=1.8.2
